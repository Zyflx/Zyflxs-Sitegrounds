<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ezekiel">
    <meta name="description" content="My contact information for my web page project.">
    <meta name="keywords" content="html, coding, web dev, programming">

    <link rel="stylesheet" href="zyflxs-sitegrounds.css" type="text/css">

    <title>Zyflx's Sitegrounds - Contact</title>
</head>
<body>
    <!-- Site Navigation -->
    <nav id="top">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="resume.html"><span class="selected">Resume</span></a>
            </li>
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="newsletter.html">Newsletter</a></li>
            <li><a href="transcript.html">Transcript</a></li>
            <li><a href="https://scf.edu">SCF Website</a></li>
        </ul>
    </nav>
    <header id="header">
        <hr id="header-divider">
        <div class="main-section"> <!-- Main Section -->
            <main style="padding-left: 150px" class="contact-main">
                <form name="contactForm" id="contactForm" action="FormProcess.php" method="post">
                <input type="hidden" name="subject" value="Zyflxs Sitegrounds Contact Submission">
                <input type="hidden" name="redirect" value="contactSent.html"> 
                <table id="contact" style="width: 80%;">
                    <th style="text-align: right;">Contact Me!</th>
                    <tr>
                        <td colspan="2" style="text-align: center;"><span class="required-field">*</span> First Name</td>
                        <td><input name="FirstName" type="text"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;"><span class="required-field">*</span> Last Name</td>
                        <td><input name="LastName" type="text"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">Gender</td>
                        <td>
                            <input type="radio" name="Gender" id="M" value="M">M
                            <input type="radio" name="Gender" id="F" value="F">F
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">Region</td>
                        <td>
                            <select name="Region Here">
                                <option value="">None</option>
                                <option value="US">United States</option>
                                <option value="UK">Europe</option>
                                <option value="SA">South America</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">City</td>
                        <td><input name="City Here" type="text"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;">Zip</td>
                        <td><input name="Zip Here" type="text"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;"><span class="required-field">*</span> Email Address</td>
                        <td><input id="email" name="Email" type="email" required></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;"><span class="required-field">*</span> Message</td>
                        <td><textarea cols="20" rows="5" name="Comments" type="text"></textarea></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;"></td>
                        <td><input name="Reset Form" type="reset" value="Reset Form"></td>
                    </tr>
                    <tr>
                        <td colspan="2" style="text-align: center;"></td>
                        <td><input name="" type="submit" value="Submit Form"></td>
                    </tr>
                </table>
                </form>
            </main>
        </div>
</body>
</html>
